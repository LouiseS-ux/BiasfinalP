# roberta_legacy below is legacy, ignore. Active classifier used: HEARTS ALBERT-v2.
# HEARTS model/settings load from HuggingFace. llms/api settings are OpenAI/Anthropic.
# paths are local pipeline output files.

llms:
  - gpt-4o
  - claude-opus-4-5

probe_bank:
  target_pairs: 250
  sources:
    - winobias
    - original
  categories:
    - professional_role
    - personality_trait
    - ambiguous_scenario
    - coreference_ambiguity
    - candidate_choice
    - coreference_choice

classifier:
  model_name: holistic-ai/bias_classifier_albertv2
  cache_dir: models/hearts_albertv2/
  max_seq_length: 256
  shap_max_evals: 200
  seed: 42

roberta_legacy:
  training_data: stereoset
  model_name: roberta-base
  num_epochs: 6
  batch_size: 8
  learning_rate: 0.00001
  max_seq_length: 256
  output_dir: models/roberta_finetuned/
  target_f1: 0.75
  seed: 42
  weight_decay: 0.01
  eval_strategy: epoch
  warmup_steps: 50

api:
  call_delay_seconds: 0.5
  max_retries: 3
  models:
    openai: gpt-4o
    anthropic: claude-opus-4-5

paths:
  raw_data: data/raw/
  probe_bank: data/probe_bank.json
  completions: data/completions.json
  predictions: data/predictions.json
  summary_stats: data/summary_stats.json
  shap_summary: data/shap_summary.json
  shap_values: data/shap_values.json
  hearts_predictions: data/hearts_predictions.json
  hearts_shap_values: data/hearts_shap_values.json
  hearts_shap_summary: data/hearts_shap_summary.json
  hearts_summary: data/hearts_summary.json
  hearts_divergence: data/hearts_divergence_results.txt
  roberta_metrics: models/roberta_finetuned/metrics.json

dashboard:
  default_view: top10