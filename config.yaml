llms:
  - gpt-4o
  - claude-opus-4-5

probe_bank:
  target_pairs: 150
  sources:
    - winobias        # restructured into conversational prompts
    - original        # hand-written probes to test generalisation
  categories:
    - professional_role
    - personality_trait
    - ambiguous_scenario

classifier:
  training_data: stereoset   # StereoSet only — kept separate from probe sources
  model_name: roberta-base
  num_epochs: 3
  batch_size: 16
  learning_rate: 2e-5
  max_seq_length: 256
  output_dir: models/roberta_finetuned/
  target_f1: 0.75
  seed: 42

api:
  call_delay_seconds: 0.5
  max_completions_per_run: 500

paths:
  raw_data: data/raw/
  probe_bank: data/probe_bank.json
  completions: data/completions.json
  predictions: data/predictions.json
  summary_stats: data/summary_stats.json
  shap_values: data/shap_values.json
  metrics: models/roberta_finetuned/metrics.json

dashboard:
  confidence_threshold_default: 0.5
