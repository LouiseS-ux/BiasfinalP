llms:
  - gpt-4o
  - claude-opus-4-5

probe_bank:
  target_pairs: 150
  sources:
    - winobias        # professional roles and coreference ambiguity
    - original        # personality descriptors and scenario-based
  categories:
    - professional_role       # 50 pairs: WinoBias + original
    - personality_trait       # 40 pairs: original only
    - ambiguous_scenario      # 40 pairs: original only
    - coreference_ambiguity   # 20 pairs: WinoBias only

classifier:
  training_data: stereoset
  model_name: roberta-base
  num_epochs: 6
  batch_size: 8
  learning_rate: 0.00001
  max_seq_length: 256
  output_dir: models/roberta_finetuned/
  target_f1: 0.75
  seed: 42
  weight_decay: 0.01
  eval_strategy: epoch
  warmup_steps: 50
  shap_max_evals: 200


api:
  call_delay_seconds: 0.5
  max_retries: 3
  models:
    openai: gpt-4o
    anthropic: claude-opus-4-5

paths:

  raw_data: data/raw/
  probe_bank: data/probe_bank.json
  completions: data/completions.json
  predictions: data/predictions.json
  summary_stats: data/summary_stats.json
  shap_summary: data/shap_summary.json
  shap_values: data/shap_values.json
  metrics: models/roberta_finetuned/metrics.json
  hearts_predictions: data/hearts_predictions.json
  hearts_shap_values: data/hearts_shap_values.json
  hearts_shap_summary: data/hearts_shap_summary.json
  hearts_summary: data/hearts_summary.json
  hearts_divergence: data/hearts_divergence_results.txt

dashboard:
  default_view: flagged   # "flagged" or "all" — which probe set the Tab 2 selector opens with
